- name: Run Tests
        run: |
          # Detectar el primer simulador de iPhone disponible en el runner
          DEST_ID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Usando simulador con ID: $DEST_ID"
          
          # Encender el simulador
          xcrun simctl boot "$DEST_ID" || true

          # Ejecutar los tests apuntando al ID obtenido
          xcodebuild test \
            -project SGNTickets.xcodeproj \
            -scheme SGNTickets \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
