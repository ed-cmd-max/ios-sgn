name: iOS Simulator Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test in iOS Simulator
        run: >-
          xcodebuild test
          -project SGNTickets.xcodeproj
          -scheme SGNTickets
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          if-no-files-found: warn
