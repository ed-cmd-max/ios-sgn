name: iOS Simulator Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Tests
        run: |
          # Detectar el primer simulador de iPhone disponible en el runner
          DEST_ID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Usando simulador con ID: $DEST_ID"

          # Encender el simulador
          xcrun simctl boot "$DEST_ID" || true

          # Ejecutar los tests apuntando al ID obtenido
          xcodebuild test \
            -project SGNTickets.xcodeproj \
            -scheme SGNTickets \
            -destination "platform=iOS Simulator,id=$DEST_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
